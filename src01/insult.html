<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Shakespearean Insult</title>
        <style>
            #intro {
                font-size: 1.5em;
                font-style: oblique;
            }

            #quote {
                font-size: 1.2em;
                font-weight: bold;
                text-align: center;
                font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif
            }

            #source {
                font-size: 0.8em;
                font-style: italic;
                text-align: right;
                font-family: 'Courier New', Courier, monospace;
            }
        </style>
    </head>
    <body>
        <h1>Insult - but Shakespeare</h1>
        <p id="intro">Here is how to tell someone off the classy way:</p>
        <p id="quote">
            [Thou] leathern-jerkin, crystal-button, knot-pated, agate-ring, puke-stocking, caddis-garter, smooth-tongue, Spanish pouch!
        </p>
        <p id="source">- William Shakespeare, Henry IV Part I</p>
    </body>
</html>
