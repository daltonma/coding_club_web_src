<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Color CSS</title>
        <style>
            p {
                color: blue;
            }

            div {
                color: red;
            }
        </style>
    </head>
    <body>
        <p>This text is blue</p>
        <p>So is this text!</p>
        <div>But not this text, this text is red.</div>

    </body>
</html>
