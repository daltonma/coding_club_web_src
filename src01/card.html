<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Cards</title>
        <style>
            .card {
                border: 1px solid black;
                border-radius: 5px;
                padding: 10px;
                margin: 10px;
                width: 200px;
                display: inline-block;
            }

            .card h2 {
                font-size: 1.5em;
                font-weight: bold;
                text-align: center;
            }

            .card p {
                font-size: 1.2em;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1>Cards</h1>
        <div class="card">
            <h2>Card 1</h2>
            <p>This is the first card.</p>
        </div>
        <div class="card">
            <h2>Card 2</h2>
            <p>This is the second card.</p>
        </div>
        <div class="card">
            <h2>Card 3</h2>
            <p>This is the third card.</p>
        </div>
    </body>
</html>
